<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY KITBOOK</title><style>
body{margin:0;background:#f3f6f8;color:#172033;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:#14532d;color:white;padding:22px;font-size:24px;font-weight:bold}main{max-width:900px;margin:22px auto;padding:0 14px}.box{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:7px 0 13px;border:1px solid #bbb;border-radius:9px;font:inherit}button{padding:11px 15px;border:0;border-radius:9px;background:#14532d;color:white;font:inherit;margin:4px}button.alt{background:#e6f1e9;color:#14532d}.hidden{display:none}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:9px 0}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header>🛡️ MY KITBOOK</header><main>
<section id="auth" class="box"><h2>লগইন / নতুন অ্যাকাউন্ট</h2><label>Gmail</label><input id="email" type="email" placeholder="আপনার Gmail"><label>Password</label><input id="password" type="password" placeholder="কমপক্ষে ৬ অক্ষর"><button id="signup">নতুন অ্যাকাউন্ট</button><button id="signin" class="alt">লগইন</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="box"><button id="logout" class="alt">লগআউট</button><h2>আমার কিট</h2><p id="user" class="muted"></p><p id="summary"></p></div><div class="grid"><section class="box"><h3>কিটের তালিকা</h3><div id="items"></div></section><section class="box"><h3 id="formtitle">নতুন কিট যোগ</h3><label>মালামালের নাম</label><input id="name" placeholder="যেমন: চাদর"><label>প্রতি বার পরিমাণ</label><input id="qty" type="number" min="1"><label>কত দিন পর পর প্রাপ্য</label><input id="days" type="number" min="1"><label>সর্বশেষ পাওয়ার তারিখ</label><input id="last" type="date"><button id="save">সংরক্ষণ</button><button id="cancel" class="alt">বাতিল</button></section></div></section>
<p class="muted">প্রাপ্যতার নিয়ম তুমি নিজে নির্ধারণ করবে।</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Supabase Project URL এবং Publishable Key বসাও। Secret key কখনো এখানে বসাবে না।
const SUPABASE_URL="PASTE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY="PASTE_PUBLISHABLE_KEY";
const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_")&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=x=>document.getElementById(x);let editing=null,rows=[];
function message(t){$("msg").textContent=t}
$("signup").onclick=async()=>{if(!ready)return message("আগে Project URL ও Publishable Key বসাতে হবে.");let {data,error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});if(error)return message(error.message);if(data.session)openApp(data.user);else message("অ্যাকাউন্ট তৈরি হয়েছে। Email confirmation চালু থাকলে inbox দেখুন।")};
$("signin").onclick=async()=>{if(!ready)return message("আগে Project URL ও Publishable Key বসাতে হবে.");let {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return message(error.message);openApp(data.user)};
function openApp(u){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent=u.email;load()}
$("logout").onclick=async()=>{await sb.auth.signOut();$("app").classList.add("hidden");$("auth").classList.remove("hidden")};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
function plus(d,n){let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+Number(n));return x}
function datefmt(d){return d.toLocaleDateString("bn-BD",{year:"numeric",month:"short",day:"numeric"})}
async function load(){let {data,error}=await sb.from("kit_items").select("*").order("created_at",{ascending:false});if(error)return alert(error.message);rows=data||[];draw()}
function draw(){let today=new Date();today.setHours(0,0,0,0);let upcoming=0,late=0;$("items").innerHTML="";if(!rows.length)$("items").textContent="এখনো কোনো কিট যোগ করা হয়নি।";rows.forEach(r=>{let due=plus(r.last_received,r.interval_days),left=Math.ceil((due-today)/86400000);if(left>=0&&left<=30)upcoming++;if(left<0)late++;let d=document.createElement("div");d.className="item";d.innerHTML='<b class="nm"></b><div class="muted desc"></div><p class="due"></p><button class="alt edit">সম্পাদনা</button><button class="del">মুছুন</button>';d.querySelector(".nm").textContent=r.item_name;d.querySelector(".desc").textContent="প্রতি বার "+bn(r.quantity)+"টি · প্রতি "+bn(r.interval_days)+" দিন";d.querySelector(".due").textContent=left<0?"তারিখ পেরিয়েছে "+bn(-left)+" দিন":"পরবর্তী প্রাপ্য "+datefmt(due)+" · বাকি "+bn(left)+" দিন";d.querySelector(".edit").onclick=()=>{editing=r.id;$("name").value=r.item_name;$("qty").value=r.quantity;$("days").value=r.interval_days;$("last").value=r.last_received};d.querySelector(".del").onclick=async()=>{if(confirm("মুছবেন?")){let z=await sb.from("kit_items").delete().eq("id",r.id);if(z.error)alert(z.error.message);else load()}};$("items").append(d)});$("summary").textContent="মোট "+bn(rows.length)+"টি আইটেম · ৩০ দিনের মধ্যে প্রাপ্য "+bn(upcoming)+"টি · মেয়াদ পেরিয়েছে "+bn(late)+"টি"}
$("save").onclick=async()=>{let p={item_name:$("name").value.trim(),quantity:+$("qty").value,interval_days:+$("days").value,last_received:$("last").value};if(!p.item_name||p.quantity<1||p.interval_days<1||!p.last_received)return alert("সব তথ্য পূরণ করুন।");let z=editing?await sb.from("kit_items").update(p).eq("id",editing):await sb.from("kit_items").insert(p);if(z.error)return alert(z.error.message);editing=null;$("name").value=$("qty").value=$("days").value=$("last").value="";load()};
$("cancel").onclick=()=>{editing=null;$("name").value=$("qty").value=$("days").value=$("last").value=""};
(async()=>{if(!ready)return message("সেটআপ বাকি: HTML-এ Supabase URL ও Publishable Key বসাতে হবে।");let {data}=await sb.auth.getSession();if(data.session)openApp(data.session.user)})();
</script></body></html>
